<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 250px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f17;
      color: #e2e8f0;
      margin: 0;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 8px 0;
      color: #00f0ff;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 12px;
      color: #8492a6;
      line-height: 1.4;
      margin: 0 0 12px 0;
    }
    .status-box {
      background: #141b27;
      border: 1px solid #222e42;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #00e676;
      border-radius: 50%;
      margin-right: 6px;
    }
    a.btn {
      display: block;
      text-align: center;
      background: #00f0ff;
      color: #050811;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
      padding: 8px;
      border-radius: 6px;
    }
    a.btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h2>🛡️ Token Guard</h2>
  <p>Universal Token Optimizer active on ChatGPT, Claude.ai, and Gemini.</p>
  <div class="status-box">
    <span class="status-indicator"></span> <b>Status: Active</b><br>
    <span style="color: #8492a6;">Auto-pruning prompt fluff</span>
  </div>
  <a class="btn" href="http://localhost:8088/dashboard" target="_blank">Open Full Dashboard</a>
</body>
</html>
