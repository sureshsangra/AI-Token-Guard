[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "token-guard"
version = "1.0.0"
description = "Universal Plug-and-Play Token Optimization Proxy for OpenAI, Gemini, Claude, and DeepSeek."
readme = "README.md"
authors = [{ name = "Token Guard Team" }]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.22.0",
    "click>=8.0.0"
]

[project.scripts]
token-guard = "token_guard.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["token_guard*"]
